name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    name: Types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx bob build
      - name: The iOS SDK copy matches ios/OneTraceSDK/VERSION
        run: scripts/vendor-ios-sdk.sh && git diff --exit-code -- ios/OneTraceSDK

  android:
    name: Android example build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
      - name: Build the example with the native SDK from JitPack
        working-directory: example/android
        run: ./gradlew --no-daemon assembleDebug -PreactNativeArchitectures=x86_64

  ios:
    name: iOS example build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Install pods
        working-directory: example/ios
        run: pod install
      - name: Build the example for the simulator
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild -workspace OneTraceExample.xcworkspace -scheme OneTraceExample -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
