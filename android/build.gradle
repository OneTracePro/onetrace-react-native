/**
 * The native OneTrace SDK for Android. Until it is released, the code of its `stage-105` branch comes from mavenLocal
 * (see the README); after the release, JitPack serves a tag.
 */
def oneTraceAndroid = "1.2.0"

ext.OneTrace = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return OneTrace[prop]
}

// The native SDK is published on JitPack: the app's projects resolve the module's dependencies too.
rootProject.allprojects {
  repositories {
    // Exclusive: the app's other repositories (its own jitpack.io entry) come before mavenLocal in the list.
    exclusiveContent {
      forRepository { mavenLocal() }
      filter { includeGroupByRegex "com\\.github\\.OneTracePro.*" }
    }
    maven {
      url "https://jitpack.io"
      content { includeGroupByRegex "com\\.github\\.OneTracePro.*" }
    }
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "pro.onetrace.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.github.OneTracePro.onetrace-android:onetrace:${oneTraceAndroid}"
  implementation "com.github.OneTracePro.onetrace-android:onetrace-location:${oneTraceAndroid}"
}
