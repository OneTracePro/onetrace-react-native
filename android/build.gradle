/**
 * The native OneTrace SDK for Android from JitPack, a release tag. Gradle properties of the app (`android/gradle.properties`):
 * - `onetrace.geofences=true` adds `onetrace-location` (geofences): Google Play services Location and the location
 *   permissions in the app manifest. Without it the app gets neither, and `enableGeofences` resolves `unavailable`.
 * - `onetrace.mavenLocal=true` takes the native SDK from the local Maven repository instead (a working copy of
 *   onetrace-android published with `publishReleasePublicationToMavenLocal`, version `onetrace.androidVersion`, 1.3.0
 *   by default).
 */
def oneTraceMavenLocal = project.findProperty("onetrace.mavenLocal") == "true"
def oneTraceAndroid = project.findProperty("onetrace.androidVersion") ?: "1.3.0"
def oneTraceGeofences = project.findProperty("onetrace.geofences") == "true"

ext.OneTrace = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return OneTrace[prop]
}

// The native SDK is published on JitPack: the app's projects resolve the module's dependencies too. The local Maven
// repository serves it only when the app asks for it, and then exclusively (the app's own jitpack.io entry may come first).
rootProject.allprojects {
  repositories {
    if (oneTraceMavenLocal) {
      exclusiveContent {
        forRepository { mavenLocal() }
        filter { includeGroupByRegex "com\\.github\\.OneTracePro.*" }
      }
    } else {
      maven {
        url "https://jitpack.io"
        content { includeGroupByRegex "com\\.github\\.OneTracePro.*" }
      }
    }
  }

  // The modules of the native SDK refer to each other by their own version: all of them in the version above.
  configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
      if (details.requested.group == "com.github.OneTracePro.onetrace-android") {
        details.useVersion(oneTraceAndroid)
      }
    }
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "pro.onetrace.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // `api`: the app starts the native SDK in MainApplication for geofences in the background (README).
  api "com.github.OneTracePro.onetrace-android:onetrace:${oneTraceAndroid}"
  // Geofences are compiled against, but reach the app only with `onetrace.geofences=true`.
  compileOnly "com.github.OneTracePro.onetrace-android:onetrace-location:${oneTraceAndroid}"
  if (oneTraceGeofences) {
    implementation "com.github.OneTracePro.onetrace-android:onetrace-location:${oneTraceAndroid}"
  }
}
